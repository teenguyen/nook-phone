services:
  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:80"
    develop:
      watch:
        - action: sync
          path: ./index.html
          target: /usr/share/nginx/html/index.html
        - action: sync
          path: ./css
          target: /usr/share/nginx/html/css
        - action: sync
          path: ./js
          target: /usr/share/nginx/html/js
        - action: sync
          path: ./assets
          target: /usr/share/nginx/html/assets
